<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Fantasy Hearts</title>
    <style>
        body {
            background: linear-gradient(135deg, #f7c5d4, #e06d87, #f5b7cb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart {
            position: absolute;
            background-color: var(--bg-color);
            transform: rotate(-45deg) scale(0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseAnimation 2s infinite ease-in-out;
            box-shadow: 0 0 10px 5px rgba(0, 0, 0, 0.3);
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: inherit;
            height: inherit;
            background-color: inherit;
            border-radius: 50%;
        }

        .heart::before {
            top: calc(-1 * var(--size) / 2);
            left: 0;
        }

        .heart::after {
            left: calc(var(--size) / 2);
            top: 0;
        }

        .heart-1 {
            --size: 240px;
            width: var(--size);
            height: var(--size);
            --bg-color: #e06d87;
            z-index: 1;
            animation-delay: 0s;
        }

        .heart-2 {
            --size: 180px;
            width: var(--size);
            height: var(--size);
            --bg-color: #f3a6be;
            z-index: 2;
            animation-delay: 0.3s;
        }

        .heart-3 {
            --size: 120px;
            width: var(--size);
            height: var(--size);
            --bg-color: #e8ecf1;
            z-index: 3;
            animation-delay: 0.6s;
        }

        .heart-4 {
            --size: 70px;
            width: var(--size);
            height: var(--size);
            --bg-color: #e06d87;
            z-index: 4;
            animation-delay: 0.9s;
        }

        .heart-5 {
            --size: 30px;
            width: var(--size);
            height: var(--size);
            --bg-color: #f5b7cb;
            z-index: 5;
            animation-delay: 1.2s;
        }

        @keyframes pulseAnimation {
            0% {
                transform: rotate(-45deg) scale(0.6);
                opacity: 0.3;
            }
            50% {
                transform: rotate(-45deg) scale(1.05);
                opacity: 1;
            }
            100% {
                transform: rotate(-45deg) scale(0.6);
                opacity: 0.3;
            }
        }

        /* Additional Elements */
        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 10;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="white" opacity="0.8" /><circle cx="30" cy="20" r="1" fill="white" opacity="0.8" /><circle cx="70" cy="80" r="1" fill="white" opacity="0.8" /><circle cx="20" cy="70" r="1" fill="white" opacity="0.8" /><circle cx="80" cy="30" r="1" fill="white" opacity="0.8" /><circle cx="50" cy="50" r="1" fill="white" opacity="0.8" /></svg>') repeat;
            background-size: 100px 100px;
            animation: sparkle 5s infinite linear;
        }

        @keyframes sparkle {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 11;
            text-align: center;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sparkles"></div>
        <div class="heart heart-1"></div>
        <div class="heart heart-2"></div>
        <div class="heart heart-3"></div>
        <div class="heart heart-4"></div>
        <div class="heart heart-5"></div>
        <div class="text">Love is in the air...</div>
    </div>

</body>
</html>
